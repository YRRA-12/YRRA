function addDays(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){const da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');return Math.round((db-da)/86400000);}
function fmtDate(str){const d=new Date(str+'T00:00:00');return (d.getMonth()+1)+'月'+d.getDate()+'日';}

/* ================= 每日任务调度引擎 ================= */
function dailyPlan(dateStr){
  const d=dayIndex(dateStr); if(d<1) return [];
  const tasks=[];
  BOOKS.forEach(b=>{
    if(d>=b.sd && d<=b.ed){
      const span=b.ed-b.sd+1, step=span/b.units;
      const u=Math.min(b.units, Math.floor((d-b.sd)/step)+1);
      const m = b.type==='单词'?20:(b.type==='听力'?15:15);
      tasks.push({id:`${b.key}_u${u}_d${d}`, subj:b.subj, t:`${b.name} 第${u}单元`, m});
    }
  });
  tasks.push({id:`oral_en_d${d}`, subj:'口语', t:'英语跟读/影子练习 10分钟', m:10});
  tasks.push({id:`oral_jp_d${d}`, subj:'口语', t:'日语朗读+录音 5分钟', m:5});
  tasks.push({id:`cet_lis_d${d}`, subj:'CET6', t:'六级听力 1篇', m:15});
  const rot=['六级阅读 1篇','六级写作 1篇','六级翻译 1篇'][(d-1)%3];
  tasks.push({id:`cet_rw_d${d}`, subj:'CET6', t:rot, m:20});
  if(d>=57){
    const subj=['N1','N2','CET6'][(d-57)%3];
    tasks.push({id:`zk_${subj}_d${d}`, subj, t:`${subjName(subj)}真题 1套（计入真题进度）`, m:60, zk:true, zsubj:subj});
  }
  if(d%7===0){
    tasks.push({id:`rev_d${d}`, subj:'N2', t:'复习本周错题/笔记', m:30});
    if(d>=78) tasks.push({id:`mk_d${d}`, subj:'N1', t:'全真模考 1套（建议周末）', m:120});
  }
  return tasks;
}

/* ================= 综合完成度 ================= */
function composite(){
  let msT=0,msD=0; S.milestones.forEach(p=>p.items.forEach(i=>{msT++;if(i.done)msD++;}));
  const msPct=msT?msD/msT:0;
  let tot=0,done=0; const end=dayIndex(todayStr());
  for(let d=1;d<=end;d++){const ds=addDays(S.startDate,d-1);const pl=dailyPlan(ds);tot+=pl.length;
    const arr=S.doneDaily[ds]||[]; done+=pl.filter(t=>arr.includes(t.id)).length;}
  const taskPct=tot?done/tot:0;
  const subs=['N1','N2','CET6']; let hit=0;
  subs.forEach(s=>{const m=lastMock(s);if(m&&m.score>=S.targets[s])hit++;});
  const mockPct=hit/3;
  const total=0.4*msPct+0.4*taskPct+0.2*mockPct;
  return {total,msPct,taskPct,mockPct,hit,msD,msT,done,tot};
}
function lastMock(subj){const a=S.mock.filter(m=>m.subj===subj);if(!a.length)return null;return a.sort((x,y)=>x.date<y.date?1:-1)[0];}
function zhentiDone(subj){let c=0;for(const d in S.doneDaily){S.doneDaily[d].forEach(id=>{if(id.indexOf('zk_'+subj+'_')===0)c++;});}return c;}

    <div class="kv"><span>满勤天数</span><b>${doneDays}/7</b></div>
    <div class="kv"><span>连续打卡</span><b>${streak} 天</b></div>
    <div class="kv"><span>N1 / N2 / 六级 最新模考</span><b>${ln1?ln1.score:'—'} / ${ln2?ln2.score:'—'} / ${lc?lc.score:'—'}</b></div>
    <div class="kv"><span>本周心情</span><b>${moods||'未记录'}</b></div>
    <div class="kv"><span>下周重点</span><b style="max-width:60%;text-align:right">${focuses[Math.min(4,Math.max(1,wk))]||'查漏补缺'}</b></div>
    <div class="suggest"><b>建议：</b><br>${sugg.map(s=>'· '+s).join('<br>')}</div>
    ${mindmapSVG(rate,streak,cp,moods)}`;
  S.reports.push({week:wk,from,to,html,mm:''}); save(); render('weekly'); toast('本周复盘已生成');
}
function genMonthly(){
  const label='近30天总结';
  let doneTasks=0,totTasks=0; const end=dayIndex(todayStr());
  for(let i=Math.max(0,end-30);i<end;i++){const ds=addDays(S.startDate,i);const pl=dailyPlan(ds);if(!pl.length)continue;totTasks+=pl.length;const arr=S.doneDaily[ds]||[];doneTasks+=pl.filter(t=>arr.includes(t.id)).length;}
  const rate=totTasks?Math.round(doneTasks/totTasks*100):0;
  const streak=calcStreak();
  const cp=composite();
  const cheer=CHEER[Math.floor(Math.random()*CHEER.length)];
  const moods=monthMoods();
  const html=`
    <div class="kv"><span>近30天任务完成率</span><b>${rate}%</b></div>
    <div class="kv"><span>连续打卡</span><b>${streak} 天</b></div>
    <div class="kv"><span>综合总进度</span><b>${Math.round(cp.total*100)}%</b></div>
    <div class="kv"><span>模考达标</span><b>${cp.hit}/3</b></div>
    <div class="kv"><span>整体心情</span><b>${moods||'未记录'}</b></div>
    <div class="suggest"><b>月度鼓励：</b><br>${cheer}<br>· ${rate>=80?'完成率很高，保持这个势头。':rate>=50?'稳步推进，别松懈，冲刺期会更吃劲。':'量有点松，找个固定时段把节奏拉起来。'}</div>`;
  S.monthly.push({label,html}); save(); render('weekly'); toast('本月总结已生成');
}
const focuses={1:'N2查漏+红宝书单词+N1语法起步，口语先破冰',2:'N1红宝书攻坚+六级阅读提速，口语加短句',3:'知识点闭环+真题首刷，口语自言自语',4:'全真模考+错题回炉，口语计时表达'};
function buildSuggestions(rate,streak,cp){
  const s=[];
  if(cp.hit<3) s.push(`模考尚未全科达标（${cp.hit}/3），优先补薄弱科目真题与错题回炉。`);
  if(rate<60) s.push(`本周任务完成率仅 ${rate}%，任务量可能偏重，可适当精简或固定时段。`);
  if(streak<3) s.push('连续打卡较短，建议固定同一时间学习，形成肌肉记忆。');
  if(s.length===0) s.push('本周状态优秀，保持节奏，注意劳逸结合，别透支。');
  return s;
}
function weekMoods(wk){
  const from=addDays(S.startDate,(wk-1)*7); let cnt={};
  for(let i=0;i<7;i++){const d=addDays(from,i);if(S.diary[d]&&S.diary[d].mood)cnt[S.diary[d].mood]=(cnt[S.diary[d].mood]||0)+1;}
  const keys=Object.keys(cnt); if(!keys.length)return '';
  return keys.sort((a,b)=>cnt[b]-cnt[a])[0]+`（${keys.length}天有记录）`;
}
function monthMoods(){
  const end=dayIndex(todayStr()); let cnt={};
  for(let i=Math.max(0,end-30);i<end;i++){const d=addDays(S.startDate,i);if(S.diary[d]&&S.diary[d].mood)cnt[S.diary[d].mood]=(cnt[S.diary[d].mood]||0)+1;}
  const keys=Object.keys(cnt); if(!keys.length)return '';
  return keys.sort((a,b)=>cnt[b]-cnt[a])[0];
}
function mindmapSVG(rate,streak,cp,moods){
  const c='#9cc4ff'; const cx=340,cy=140;
  const branches=[
    {x:120,y:50,t:'完成率 '+rate+'%',col:'#4f8cff'},
    {x:560,y:50,t:'打卡 '+streak+'天',col:'#74b4ff'},
    {x:120,y:240,t:'模考 '+cp.hit+'/3',col:'#2f57c9'},
    {x:560,y:240,t:'心情 '+(moods||'—'),col:'#b18cff'},
  ];
  let s=`<svg class="mindmap" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs><radialGradient id="cg" cx="50%" cy="50%"><stop offset="0%" stop-color="rgba(116,180,255,.35)"/><stop offset="100%" stop-color="rgba(79,140,255,.05)"/></radialGradient></defs>`;
  branches.forEach(b=>{ s+=`<line x1="${cx}" y1="${cy}" x2="${b.x}" y2="${b.y}" stroke="rgba(116,180,255,.35)" stroke-width="2"/>`; });
  s+=`<circle cx="${cx}" cy="${cy}" r="46" fill="url(#cg)" stroke="rgba(116,180,255,.6)" stroke-width="1.5"/>`;
  s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">第${Math.floor((dayIndex(todayStr())-1)/7)+1}周</text>`;
  s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" fill="#9cc4ff" font-size="11">状态</text>`;
  branches.forEach(b=>{
    s+=`<circle cx="${b.x}" cy="${b.y}" r="40" fill="rgba(255,255,255,.05)" stroke="${b.col}" stroke-width="1.5"/>`;
    s+=`<text x="${b.x}" y="${b.y+4}" text-anchor="middle" fill="#eaf0f7" font-size="11">${b.t}</text>`;
  });
  s+=`</svg>`;
  return s;
}

/* ================= 每日日记 ================= */
function diaryHTML(){
  const t=todayStr(); const cur=S.diary[t]||{mood:'',did:'',feel:''};
  const moods=['😀','🙂','😐','😟','😫'];
  return `
  <div class="sec-title">每日日记 <span class="tag">${fmtDate(t)}</span></div>
  <div class="card" style="margin-bottom:16px">
    <h3>✎ 今天</h3>
    <div class="mood-row" id="moodRow">${moods.map(m=>`<div class="mood ${cur.mood===m?'sel':''}" data-mood="${m}">${m}</div>`).join('')}</div>
    <div style="margin:8px 0"><label class="target-line">我干了什么</label><textarea id="diDid" rows="3" placeholder="今天完成了哪些学习任务？">${cur.did||''}</textarea></div>
    <div style="margin:8px 0"><label class="target-line">我感觉怎么样</label><textarea id="diFeel" rows="3" placeholder="状态、卡点、开心的事……">${cur.feel||''}</textarea></div>
    <div class="row"><button class="btn" id="saveDiary">💾 保存今日日记</button>${cur.mood?'<span class="target-line" style="color:var(--ok)">已保存</span>':''}</div>
  </div>
  <div class="card"><h3>📖 近期日记</h3>
    ${diaryList()}
  </div>`;
}
function diaryList(){
  const keys=Object.keys(S.diary).sort().reverse().slice(0,8);
  if(!keys.length) return `<div class="empty">还没有日记。</div>`;
  return keys.map(d=>`<div class="kv"><span>${fmtDate(d)} ${S.diary[d].mood}</span><b style="max-width:65%;text-align:right;font-weight:500">${(S.diary[d].did||'').slice(0,40)||'(未填)'}</b></div>`).join('');
}

/* ================= 后续规划 ================= */
function futureHTML(){
  return `
  <div class="sec-title">长期路线 <span class="tag">12月双考之后</span></div>
  <div class="grid g2">
    <div class="card"><h3>🗣 日语口语提升</h3><div class="target-line" style="line-height:1.9">
      <b>阶段A（考后1-2月）</b>：每日影子练习+录音纠音。<br><b>阶段B（3-4月）</b>：找语伴/AI对话，按场景积累表达。<br><b>阶段C（长期）</b>：看无字幕日剧/新闻，即兴1分钟陈述。<br><span style="color:var(--p1)">考后可将「口语」任务升级为高频模块。</span></div></div>
    <div class="card"><h3>📚 考研英语预备</h3><div class="target-line" style="line-height:1.9">
      <b>词汇</b>：六级词基础上扩展考研核心5500+，长难句拆解。<br><b>阅读</b>：考研真题精读，逻辑定位。<br><b>写作</b>：模板+句式，每周1篇。<br><b>时间</b>：双考后第2周启动，可新增「考研」科目。<br><span style="color:var(--p1)">后续可在「设置」扩展科目，不必重建。</span></div></div>
  </div>
  <div class="ok-banner" style="margin-top:16px">✓ 当前所有模块已为长期演进预留数据结构，考后一键切换重心即可。</div>`;
}

/* ================= 设置 ================= */
function setHTML(){
  let pp=''; ['N1','N2','CET6'].forEach(s=>{pp+=`<label>${subjName(s)}真题总套数</label><input type="number" id="pp_${s}" value="${S.pastPapers[s]}" style="width:80px"> `;});
  return `
  <div class="sec-title">设置</div>
  <div class="card" style="margin-bottom:14px"><h3>⏱ 考试与目标</h3>
    <div class="row" style="margin-bottom:10px"><label>JLPT日期</label><input type="date" id="setJlpt" value="${S.exams.jlpt}"></div>
    <div class="row" style="margin-bottom:10px"><label>CET-6日期</label><input type="date" id="setCet" value="${S.exams.cet6}"></div>
    <div class="row" style="margin-bottom:10px"><label>每日目标(分)</label><input type="number" id="setMin" value="${S.dailyTargetMin}" style="width:100px"></div>
    <div class="row" style="margin-bottom:10px"><label>提醒时间</label><input type="time" id="setTime" value="${S.reminderTime}"></div>
    <div class="row" style="margin-bottom:10px"><label>N1目标</label><input type="number" id="setN1" value="${S.targets.N1}" style="width:80px"><label>N2目标</label><input type="number" id="setN2" value="${S.targets.N2}" style="width:80px"><label>六级目标</label><input type="number" id="setC" value="${S.targets.CET6}" style="width:80px"></div>
    <button class="btn" id="saveSet">保存设置</button>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>📄 真题套数基准</h3><div class="row" style="margin-bottom:10px">${pp}</div><button class="btn ghost sm" id="savePP">保存真题基准</button><div class="hint">勾选「真题1套」任务会自动累计到模考追踪的真题进度。</div></div>
  <div class="card" style="margin-bottom:14px"><h3>📲 手机提醒（.ics）</h3><div class="target-line" style="margin-bottom:10px">导出日历文件，导入手机系统日历后每天到点弹提醒。</div><button class="btn ghost" id="expIcs">导出每日学习提醒 .ics</button></div>
  <div class="card" style="margin-bottom:14px"><h3>💾 数据备份</h3><div class="row"><button class="btn ghost" id="expJson">导出 JSON</button><button class="btn ghost" id="impJson">导入 JSON</button><input type="file" id="impFile" accept="application/json" style="display:none"></div><div class="hint">数据自动存本机浏览器（仅此手机/此浏览器）；导出 JSON 作额外保险，清缓存或换手机前务必先导出。</div></div>
  <div class="card"><h3>🗑 重置</h3><div class="row"><button class="btn warn" id="resetBtn">清空并恢复默认</button><span class="target-line">会删除所有打卡、模考、日记记录。</span></div></div>`;
}

/* ================= 交互绑定 ================= */
function bindView(v){
  if(v==='today'){
    document.querySelectorAll('[data-chk]').forEach(el=>el.onclick=()=>{toggleTask(el.dataset.chk);render('today');});
    document.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>delTask(el.dataset.del));
    document.getElementById('checkinBtn').onclick=doCheckin;
    document.getElementById('gotoDiary').onclick=()=>{switchView('diary');};
  }
  if(v==='dash'){ document.querySelectorAll('#dashTasks [data-chk]').forEach(el=>el.onclick=()=>{toggleTask(el.dataset.chk);render('dash');}); }
  if(v==='plan'){ document.querySelectorAll('[data-mschk]').forEach(el=>el.onclick=()=>toggleMs(el.dataset.mschk)); }
  if(v==='mock'){ document.getElementById('addMock').onclick=()=>{
    const subj=document.getElementById('mSubj').value, date=document.getElementById('mDate').value, score=parseInt(document.getElementById('mScore').value);
    if(!date||isNaN(score)){toast('填好日期和分数');return;} S.mock.push({subj,date,score}); save(); render('mock'); toast('已记录'); }; }
  if(v==='weekly'){ document.getElementById('genWeek').onclick=genWeekly; document.getElementById('genMonth').onclick=genMonthly; }
  if(v==='diary'){
    document.querySelectorAll('#moodRow .mood').forEach(el=>el.onclick=()=>{
      document.querySelectorAll('#moodRow .mood').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');
    });
    document.getElementById('saveDiary').onclick=()=>{
      const mood=document.querySelector('#moodRow .mood.sel'); if(!mood){toast('先选个心情');return;}
      S.diary[todayStr()]={mood:mood.dataset.mood,did:document.getElementById('diDid').value,feel:document.getElementById('diFeel').value,saved:true};
      save(); render('diary'); toast('日记已保存 ✓');
    };
  }
  if(v==='set'){
    document.getElementById('saveSet').onclick=()=>{
      S.exams.jlpt=document.getElementById('setJlpt').value; S.exams.cet6=document.getElementById('setCet').value;
      S.dailyTargetMin=+document.getElementById('setMin').value||120; S.reminderTime=document.getElementById('setTime').value;
      S.targets.N1=+document.getElementById('setN1').value||100; S.targets.N2=+document.getElementById('setN2').value||90; S.targets.CET6=+document.getElementById('setC').value||550;
      save(); updateGlobal(); renderCountdowns(); toast('设置已保存'); };
    document.getElementById('savePP').onclick=()=>{['N1','N2','CET6'].forEach(s=>S.pastPapers[s]=+document.getElementById('pp_'+s).value||0);save();toast('真题基准已存');};
    document.getElementById('expIcs').onclick=exportIcs;
    document.getElementById('expJson').onclick=()=>exportJson();
    document.getElementById('impJson').onclick=()=>document.getElementById('impFile').click();
    document.getElementById('impFile').onchange=importJson;
    document.getElementById('resetBtn').onclick=()=>{if(confirm('确定清空所有数据并恢复默认？')){localStorage.removeItem(STORE_KEY);S=load();if(cbReady){try{cbDb.collection(CB_COLL).doc(CB_USER).remove().catch(()=>{});}catch(e){}}render('dash');updateGlobal();toast('已重置');}};
  }
}
function switchView(v){ document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v)); document.getElementById('topTitle').textContent=TITLES[v]; render(v); }

function toggleTask(id){const t=todayStr();if(!S.doneDaily[t])S.doneDaily[t]=[];const i=S.doneDaily[t].indexOf(id);if(i>=0)S.doneDaily[t].splice(i,1);else S.doneDaily[t].push(id);save();}
function delTask(id){Object.keys(S.doneDaily).forEach(d=>{S.doneDaily[d]=S.doneDaily[d].filter(x=>x!==id);});save();render('today');toast('已删除');}
function toggleMs(key){const [p,id]=key.split(':');const ph=S.milestones.find(x=>+x.phase===+p);const it=ph.items.find(i=>i.id===id);it.done=!it.done;save();}
function doCheckin(){
  const t=todayStr();
  if(!S.diary[t]||!S.diary[t].saved){ toast('请先写今日日记再打卡 →'); switchView('diary'); return; }
  if(S.checkins.includes(t)){ toast('今天已打卡 🔥'); return; }
  S.checkins.push(t); save(); render('today'); toast('打卡成功 🔥');
}
function calcStreak(){const arr=S.checkins.slice().sort();if(!arr.length)return 0;let streak=0,cur=todayStr();
  if(arr[arr.length-1]!==cur){cur=addDays(todayStr(),-1);if(arr[arr.length-1]!==cur)return 0;}
  for(let i=arr.length-1;i>=0;i--){if(arr[i]===cur){streak++;cur=addDays(cur,-1);}else break;}
  return streak;}

/* ================= 导入导出 ================= */
function download(name,content,type){const blob=new Blob([content],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportJson(){download('学习工作台数据.json',JSON.stringify(S,null,2),'application/json');toast('已导出 JSON');}
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));save();render('dash');updateGlobal();toast('导入成功');}catch(err){toast('文件格式错误');}};r.readAsText(f);}
function exportIcs(){const t=S.reminderTime||'20:00';const [hh,mm]=t.split(':');const end=Math.min(S.exams.jlpt,S.exams.cet6);
  let ics='BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//WorkBuddy//Study//CN\n';
  ics+='BEGIN:VEVENT\nUID:jp-en-'+Date.now()+'@wb\n';
  ics+='DTSTART:'+S.startDate.replace(/-/g,'')+'T'+hh+mm+'00\n';
  ics+='DTEND:'+S.startDate.replace(/-/g,'')+'T'+(parseInt(hh)+1).toString().padStart(2,'0')+mm+'00\n';
  ics+='RRULE:FREQ=DAILY;UNTIL='+end.replace(/-/g,'')+'T235959Z\n';
  ics+='SUMMARY:日语×英语 每日学习（'+S.dailyTargetMin+'分钟）\n';
  ics+='DESCRIPTION:打开「学习工作台.html」完成今日任务并写日记打卡。\n';
  ics+='BEGIN:VALARM\nTRIGGER:-PT0M\nACTION:DISPLAY\nDESCRIPTION:该学习了！\nEND:VALARM\nEND:VEVENT\nEND:VCALENDAR';
  download('每日学习提醒.ics',ics,'text/calendar');toast('已导出，导入手机日历');}

/* ================= 启动 ================= */
render('dash'); renderCountdowns();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
